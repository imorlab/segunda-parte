<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Segunda Parte">
  <title>Segunda Parte</title>
  <!-- El campo de futbol sala de la cabecera, reducido a lo que sobrevive
       a 32 px: bordes, linea de medios, circulo central y las dos areas.
       Va a sangre y cuadrado a proposito: iOS y Android aplican su propia
       mascara redondeada, y redondearlo aqui deja esquinas dobles. -->
  <rect width="64" height="64" fill="#7BE05C"/>
  <g fill="none" stroke="#0A2810" stroke-width="3.4" stroke-linejoin="round">
    <rect x="9" y="13" width="46" height="38" rx="2"/>
    <path d="M32 13V51"/>
    <circle cx="32" cy="32" r="7.5"/>
    <path d="M9 24h5v16H9"/>
    <path d="M55 24h-5v16h5"/>
  </g>
</svg>
